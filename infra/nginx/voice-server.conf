server {
    listen 80;
    server_name voice.workflow-tech.info;

    # Forward all traffic to Next.js by default
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Voice Server Health Check
    location /health {
        proxy_pass http://localhost:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Logging for verification
        access_log /var/log/nginx/voice_server_access.log;
    }

    # AWS Chime SIP Webhook
    location /chime-webhook {
        proxy_pass http://localhost:8080/chime-webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Logging for verification
        access_log /var/log/nginx/voice_server_access.log;
    }

    # WebSocket Audio Stream
    location /call-stream {
        proxy_pass http://localhost:8080/call-stream;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeout for long-running calls
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Logging for verification
        access_log /var/log/nginx/voice_server_access.log;
    }
}
