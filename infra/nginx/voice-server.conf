server {
    listen 80;
    server_name voice.workflow-tech.info;

    # Dashboard Access (Next.js)
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        access_log /var/log/nginx/voice_dashboard_access.log;
    }
}

server {
    listen 80;
    server_name api.voice.workflow-tech.info;

    # Webhook & API Access (Express)
    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        access_log /var/log/nginx/voice_api_access.log;
    }
}

server {
    listen 80;
    server_name ws.voice.workflow-tech.info;

    # WebSocket Audio Stream
    location / {
        proxy_pass http://localhost:8081;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeout for long-running calls
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        access_log /var/log/nginx/voice_ws_access.log;
    }
}
